bot:
  prefix: "d!"
  token: "PUT YOUR TOKEN HERE"
  guild_id: 0 # Guild ID here

cogs:
  admin: false
  bump: false
  candidates: false
  help: false
  help_rotator: false
  moderation: false
  onboarding: false
  rules: true
  settings: false
  devcog:
    enabled: true
    from: "beginner.devcog"
  beginner_cog:
    enabled: false
    from: beginner.beginner

database:
  name: "DB NAME HERE"
  user: "DB USERNAME HERE"
  host: "DB HOSTNAME HERE"
  port: "DB PORT HERE"
  pass: "DB PASSWORD HERE"
  driver: "sqlite"

logging:
  format: "DEV %(asctime)s: %(levelname)-9s %(name)-16s :: %(message)s"
  level: DEBUG
  global_level: INFO
  loggers:
    discord.client: ERROR
    discord.state: ERROR
    discord.gateway: ERROR
